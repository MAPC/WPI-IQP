version: '1.0.0'
required: [asset_name, site_name, attributes_raw, activities_raw, field_validated]
required_any:
  coordinates: [[coordinates_raw], [latitude, longitude]]
optional: [asset_id, site_id, municipality, subregion, latitude, longitude, coordinates_raw, field_description, accessibility_description, staff_reviewed, site_name_lookup, seo_description, street, zip_code, rental_equipment_raw, seasonal_raw, field_visitor_notes, photos_done_raw]
fields:
  asset_id: {type: string, description: 'MAPC ID when supplied; otherwise deterministic identifying-information digest.'}
  site_id: {type: string, description: 'MAPC ID when supplied; otherwise normalized site-name digest, with name-only limitation.'}
  asset_name: {type: string, nullable: false}
  site_name: {type: string, nullable: false}
  municipality: {type: string, nullable: true}
  subregion: {type: string, nullable: true}
  latitude: {type: number, nullable: true, minimum: -90, maximum: 90}
  longitude: {type: number, nullable: true, minimum: -180, maximum: 180}
  attributes_raw: {type: string, nullable: true}
  activities_raw: {type: string, nullable: true}
  field_description: {type: string, nullable: true}
  accessibility_description: {type: string, nullable: true}
  field_validated: {type: boolean_or_unknown, nullable: true}
  staff_reviewed: {type: boolean_or_unknown, nullable: true}
  source_record_key: {type: string, nullable: false}
validation:
  true_values: ['checked', 'true', 'yes', 'y', '1', 'complete', 'completed', 'finished']
  false_values: ['unchecked', 'false', 'no', 'n', '0', 'incomplete', 'unfinished', 'not complete']
  unknown_values: ['', 'unknown', 'null', 'none', 'n/a', 'na', 'not known']
  blank_checkbox_meaning: unknown
  note: 'checked means finished/reviewed. A blank export cell is Unknown; it is not proof that a visit did not occur. Explicit negative values are False.'
