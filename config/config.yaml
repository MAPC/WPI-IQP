paths:
  asset_file: null
  previous_asset_file: null
coordinates:
  correct_reversed: true
  # Advisory bounds only; valid locations outside remain on the map. Set null for no region check.
  study_area_bounds:
    min_lat: 41.0
    max_lat: 43.0
    min_lon: -73.6
    max_lon: -69.8
transit:
  # Evidence scope only. Outside this rectangle proximity is UNKNOWN, not NO.
  coverage_bounds: {min_lat: 41.0, max_lat: 43.0, min_lon: -73.6, max_lon: -69.8}
  radius_miles: 0.5
  refresh_gtfs: false
  allow_cached_gtfs: true
  gtfs_url: https://cdn.mbta.com/MBTA_GTFS.zip
  timeout_seconds: 90
  snapshot_sha256: null
gis:
  # Adjust only when supplying verified data for the new area; use a suitable metric CRS.
  coverage_bounds: {min_lat: 41.0, max_lat: 43.0, min_lon: -73.6, max_lon: -69.8}
  analysis_crs: EPSG:26986
  web_crs: EPSG:4326
  web_simplification_tolerance_m: 5
  proximity_thresholds_miles: [0.25, 0.5]
  proximity_radius_miles: 0.5
  walking_public_access: [Public]
map:
  size_metric: accessibility_feature_count
  size_thresholds: [0, 1, 2, 3, 5]
  general_size_thresholds: [0, 3, 6, 9, 12]
  size_radii: [5, 8, 12, 17, 23]
  colors:
    Transit + free parking: '#0077C8'
    Transit only: '#FFB000'
    Free parking only: '#C2187A'
    Neither: '#3D4650'
    Unknown / unresolved: '#AAB4BE'
  online_basemap: true
  basemap_name: OpenStreetMap Standard
  basemap_url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  basemap_attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
  zoom_snap: 0.25
  zoom_delta: 0.25
  wheel_px_per_zoom_level: 120
  wheel_debounce_time: 40
validation:
  true_values: [checked, 'true', 'yes', '1', complete, completed, finished]
  false_values: [unchecked, 'false', 'no', '0', incomplete, unfinished]
  blank_is_unknown: true
site_aggregation:
  access_rule: any_yes_all_no_else_unknown
  lists: union
  validation: all_assets_validated
